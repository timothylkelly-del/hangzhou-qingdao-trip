name: Cache trip images
on:
  push:
    paths:
      - '.github/workflows/cache-images.yml'
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and cache images
        shell: bash
        run: |
          mkdir -p assets
          get(){ echo "Downloading $2"; curl -L --retry 3 --connect-timeout 15 --max-time 60 -A 'Mozilla/5.0' "$1" -o "assets/$2" && test $(stat -c%s "assets/$2") -gt 5000 || rm -f "assets/$2"; }
          get 'https://p1-tt.byteimg.com/origin/tos-cn-i-qvj2lq49k0/152379bc1fc247ee9ff8008c83ec9e30.jpg' yuntai.jpg || true
          get 'https://tour.jschina.com.cn/lyzx/202009/W020200925532987968729.jpg' bajianfang.jpg || true
          get 'https://images.igaofu.com/2025/05/09/202505091158436469.jpg' senbo.jpg || true
          get 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Wanping_kou_beach.jpg' wanpingkou.jpg || true
          ls -lh assets || true
          test -f assets/yuntai.jpg
          test -f assets/bajianfang.jpg
          test -f assets/senbo.jpg
          test -f assets/wanpingkou.jpg
          git config user.name 'trip-bot'
          git config user.email 'trip-bot@users.noreply.github.com'
          git add assets
          git commit -m 'Cache all trip images locally' || exit 0
          git push
