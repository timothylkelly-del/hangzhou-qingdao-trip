name: Cache trip images
on:
  push:
    paths:
      - '.github/workflows/cache-images.yml'
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified images
        shell: bash
        run: |
          mkdir -p assets
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, os, ssl
          ua={'User-Agent':'Mozilla/5.0'}
          def dl(url,path):
              print("GET",url)
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=45) as r:
                  data=r.read()
              if len(data)<5000: raise RuntimeError("too small")
              open(path,'wb').write(data)
              print(path,len(data))
          dl('https://p1-tt.byteimg.com/origin/tos-cn-i-qvj2lq49k0/152379bc1fc247ee9ff8008c83ec9e30.jpg','assets/yuntai.jpg')
          dl('https://dimg04.c-ctrip.com/images/0203j12000jthdf674470_W_1280_853_R5_Q70.jpg','assets/senbo.jpg')
          dl('https://commons.wikimedia.org/wiki/Special:Redirect/file/Wanping_kou_beach.jpg','assets/wanpingkou.jpg')
          page='https://m.51sai.com/12984/des'
          ctx=ssl._create_unverified_context()\n          txt=urllib.request.urlopen(urllib.request.Request(page,headers=ua),timeout=45,context=ctx).read().decode('utf-8','ignore')
          m=re.search(r'''(?:src|data-original|data-src)=["']([^"']*1561785606793583\.jpg[^"']*)''',txt,re.I)
          if not m:
              m=re.search(r'''([^"' ]*1561785606793583\.jpg)''',txt,re.I)
          if not m: raise RuntimeError('bajianfang image url not found')
          url=urllib.parse.urljoin(page,m.group(1))
          print('GET',url)\n          req=urllib.request.Request(url,headers=ua)\n          with urllib.request.urlopen(req,timeout=45,context=ctx) as r: data=r.read()\n          if len(data)<5000: raise RuntimeError('bajian too small')\n          open('assets/bajianfang.jpg','wb').write(data)\n          print('assets/bajianfang.jpg',len(data))
          PY
          file assets/*
          git config user.name 'trip-bot'
          git config user.email 'trip-bot@users.noreply.github.com'
          git add assets
          git commit -m 'Cache verified trip images locally'
          git push
